# =============================================================================
# Build fakeip-filter  (ревизия с правками)
#
# Метки изменений относительно прошлой версии (для дебага):
#   [#1]  тест загрузки MRS: путь относительно home-директории mihomo + негативный контроль
#   [#2]  keepalive-джоб: GitHub отключает schedule после 60 дней без активности
#   [#3]  нормализация регистра (.lower()) при слиянии
#   [#4]  input force для обхода порога -30%
#   [ЖЕЛ] пункты из «желательно»: токен для API, умный прунинг, коммит только при
#         изменении .list, timeout, step summary, без кэша mihomo, проверка формата,
#         очистка старых релизов
#   [v3]  keepalive: сторонний экшен заблокирован GitHub -> gh api .../enable;
#         фильтр формата больше не режет строки с пробелом ("mijia cloud");
#         негативный контроль заменён проверкой MRS -> text (round-trip)
# =============================================================================
name: Build fakeip-filter

on:
  workflow_dispatch:
    inputs:
      # [#4] Ручной обход проверки "список сократился более чем на 30%".
      # Нужен, если апстрим легитимно урезал список и воркфлоу иначе застрянет.
      force:
        description: "Пропустить проверку падения количества правил (-30%)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: build-fakeip-filter
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # [#2] Отдельный джоб, чтобы keepalive отработал даже если build упал.
  # Без него GitHub отключит cron-расписание после 60 дней без активности в репо
  # (а мы коммитим только при изменениях).
  #
  # [v3] gautamkrishnar/keepalive-workflow GitHub заблокировал ("Repository access
  # blocked"), поэтому сторонний экшен убран. Вместо него - один вызов gh API:
  # PUT .../actions/workflows/<file>/enable (стандартный приём для сброса таймера
  # 60 дней). Имя файла берём из GITHUB_WORKFLOW_REF, ничего не хардкодим.
  # Если расписание всё же отключилось: Actions -> воркфлоу -> "Enable workflow".
  # ---------------------------------------------------------------------------
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow (reset 60-day inactivity timer)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # owner/repo/.github/workflows/file.yml@refs/heads/main -> file.yml
          wf="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          echo "Workflow file: $wf"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable"
          echo "Keepalive OK"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # [ЖЕЛ] защита от зависшего curl и т.п.

    env:
      CURL_OPTS: -fsSL --retry 3 --retry-delay 2 --retry-connrefused
      GH_TOKEN: ${{ github.token }} # [ЖЕЛ] для api.github.com (лимит 60/ч без токена) и gh CLI
      KEEP_RELEASES: "30" # [ЖЕЛ] сколько последних релизов fakeip-* хранить

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download source lists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work

          curl $CURL_OPTS \
            "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.list" \
            -o work/dustin.list

          curl $CURL_OPTS \
            "https://github.com/wwqgtxx/clash-rules/releases/latest/download/fakeip-filter.list" \
            -o work/wwqgtxx.list

          test -s work/dustin.list
          test -s work/wwqgtxx.list

          echo "DustinWin lines: $(wc -l < work/dustin.list)"
          echo "wwqgtxx lines: $(wc -l < work/wwqgtxx.list)"

      - name: Merge and deduplicate
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          sources = [
              ("dustin", Path("work/dustin.list")),
              ("wwqgtxx", Path("work/wwqgtxx.list")),
          ]

          # [ЖЕЛ] Проверка формата. В fake-ip-filter допустимы маски вида
          # +.a.com, *.a.com, .a.com, time.*.com, поэтому whitelist-regex не
          # используем. Вместо этого ловим признаки ДРУГОГО формата:
          # запятые, двоеточия, кавычки (DOMAIN-SUFFIX,x / YAML payload: / "- 'x'").
          # [v3] Пробел из чёрного списка УБРАН: "mijia cloud" - настоящее имя хоста
          # устройств Xiaomi Mijia (умный дом), оно штатно есть в fake-ip-filter и
          # должно попадать в итоговый список. Строки с пробелом больше не отбрасываются.
          BAD = re.compile(r"""[,:'"/\\#@]""")

          seen = set()
          merged = []
          per_source = {}   # сколько уникальных правил пришло из источника
          raw_valid = {}    # сколько валидных строк (без # и пустых) в источнике
          bad_lines = {}    # сколько строк отброшено как "не тот формат"

          for name, path in sources:
              count_raw = 0
              count_new = 0
              count_bad = 0
              for line in path.read_text(encoding="utf-8-sig").splitlines():
                  # [#3] .lower(): Example.com и example.com - один и тот же домен
                  line = line.strip().lower()
                  if not line or line.startswith("#"):
                      continue
                  if BAD.search(line):
                      count_bad += 1
                      if count_bad <= 5:
                          print(f"::warning::{name}: пропущена подозрительная строка: {line[:80]}")
                      continue
                  count_raw += 1
                  if line in seen:
                      continue
                  seen.add(line)
                  merged.append(line)
                  count_new += 1
              raw_valid[name] = count_raw
              per_source[name] = count_new
              bad_lines[name] = count_bad
              # Если апстрим сменил формат, "плохих" строк станет много -> падаем
              # с понятной ошибкой, а не публикуем мусор.
              if count_bad > max(5, 0.05 * (count_raw + count_bad)):
                  raise SystemExit(
                      f"{name}: слишком много строк в неожиданном формате "
                      f"({count_bad} из {count_raw + count_bad}). Проверь источник."
                  )

          # [ЖЕЛ] Умный прунинг (заменяет прежнюю логику "+. вместо *.").
          # Правило +.a.com покрывает a.com и ЛЮБЫЕ поддомены, поэтому лишние:
          #   *.a.com, .a.com, a.com  (тот же домен)
          #   x.a.com, *.x.a.com, +.x.a.com, ...  (любой вид правила для поддомена)
          # Старый случай "*.d при наличии +.d" входит сюда же.
          # Правила нестандартного вида (с * внутри и т.п.) не трогаем сами,
          # но они могут быть покрыты предком.
          def parse(rule):
              for prefix, kind in (("+.", "+"), ("*.", "*"), (".", ".")):
                  if rule.startswith(prefix):
                      return kind, rule[len(prefix):]
              return "", rule

          parsed = [(r, *parse(r)) for r in merged]
          plus = {base for _, kind, base in parsed if kind == "+"}

          def covered(kind, base):
              # тот же домен, но не "+."-форма (сама "+."-форма - это и есть покрывающее правило)
              if kind != "+" and base in plus:
                  return True
              # любой собственный родительский домен покрыт правилом "+."
              labels = base.split(".")
              return any(".".join(labels[i:]) in plus for i in range(1, len(labels)))

          pruned_rules = [r for r, kind, base in parsed if covered(kind, base)]
          pruned_set = set(pruned_rules)
          if pruned_set:
              merged = [r for r in merged if r not in pruned_set]

          if not merged:
              raise SystemExit("Merged list is empty")

          merged.sort()  # всё уже lower() после [#3]
          Path("work/fakeip-filter.list").write_text(
              "\n".join(merged) + "\n", encoding="utf-8"
          )

          total_raw = sum(raw_valid.values())
          duplicates = total_raw - sum(per_source.values())
          pruned = len(pruned_set)
          final = len(merged)
          skipped_bad = sum(bad_lines.values())

          print(f"DustinWin valid: {raw_valid['dustin']}, unique added: {per_source['dustin']}")
          print(f"wwqgtxx  valid: {raw_valid['wwqgtxx']}, unique added: {per_source['wwqgtxx']}")
          print(f"Duplicates skipped: {duplicates}")
          print(f"Skipped (unexpected format): {skipped_bad}")
          print(f"Pruned (covered by +.): {pruned}")
          print(f"Final unique rules: {final}")

          # для commit / release
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"dustin_raw={raw_valid['dustin']}\n")
              f.write(f"dustin_new={per_source['dustin']}\n")
              f.write(f"wwqgtxx_raw={raw_valid['wwqgtxx']}\n")
              f.write(f"wwqgtxx_new={per_source['wwqgtxx']}\n")
              f.write(f"duplicates={duplicates}\n")
              f.write(f"pruned={pruned}\n")
              f.write(f"final={final}\n")

          # [ЖЕЛ] Сводка на странице запуска
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Merge summary\n\n")
              f.write("| Source | Valid lines | Unique added | Skipped (bad format) |\n")
              f.write("|---|---|---|---|\n")
              for key, label in (("dustin", "DustinWin"), ("wwqgtxx", "wwqgtxx")):
                  f.write(f"| {label} | {raw_valid[key]} | {per_source[key]} | {bad_lines[key]} |\n")
              f.write(f"\n- Duplicates skipped: {duplicates}\n")
              f.write(f"- Pruned (covered by `+.`): {pruned}\n")
              f.write(f"- **Final rules: {final}**\n")
          PY

      # [ЖЕЛ] Кэш mihomo убран: бинарник маленький, скачивается за секунды,
      # а кэш добавлял 2 шага и ветвление. Токен нужен, чтобы не упереться в
      # лимит неавторизованных запросов к api.github.com на общих раннерах.
      - name: Install Mihomo
        shell: bash
        run: |
          set -euo pipefail
          M_VER=$(curl $CURL_OPTS -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name | ltrimstr("v")')
          test -n "$M_VER" && [ "$M_VER" != "null" ]
          echo "Latest mihomo version: $M_VER"

          curl $CURL_OPTS -o work/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v${M_VER}/mihomo-linux-amd64-v${M_VER}.gz"
          gunzip -f work/mihomo.gz
          chmod +x work/mihomo
          # Без sudo cp: запускаем напрямую ./work/mihomo
          ./work/mihomo -v

      - name: Build and validate MRS
        shell: bash
        run: |
          set -euo pipefail

          ./work/mihomo convert-ruleset domain text \
            work/fakeip-filter.list \
            work/fakeip-filter.mrs

          test -s work/fakeip-filter.mrs

          echo "Generated files:"
          ls -lh work/fakeip-filter.list work/fakeip-filter.mrs

      # [#1] Раньше path был "work/fakeip-filter.mrs" - mihomo резолвит относительные
      # пути провайдеров от своей HOME-директории (-d), а не от cwd, и требует, чтобы
      # файл лежал внутри неё. Теперь: HOME = work/, path = просто имя файла.
      - name: Test mihomo loads MRS
        shell: bash
        run: |
          set -euo pipefail
          cat > work/test-config.yaml << 'EOF'
          mixed-port: 0
          allow-lan: false
          mode: rule
          log-level: error
          dns:
            enable: true
            enhanced-mode: fake-ip
            fake-ip-range: 198.18.0.1/16
            fake-ip-filter:
              - rule-set:fakeip
            nameserver:
              - 8.8.8.8
          rule-providers:
            fakeip:
              type: file
              behavior: domain
              format: mrs
              path: fakeip-filter.mrs
          rules:
            - MATCH,DIRECT
          EOF

          ./work/mihomo -d work -t -f work/test-config.yaml
          echo "Mihomo config + MRS load OK"

          # [v3] Негативный контроль показал (см. лог): 'mihomo -t' НЕ читает содержимое
          # MRS, т.е. проверка выше валидирует только конфиг. Контроль убран, вместо него
          # - реальная проверка содержимого: разворачиваем .mrs обратно в текст самим
          # mihomo и сверяем количество правил с исходным .list.
          # Обратная конвертация (convert-ruleset domain mrs ...) есть не во всех версиях,
          # поэтому если команда не поддерживается - только ::warning::, сборку не валим.
          # Падаем лишь если развернулось явно меньше (<95%) или пусто.
          if ./work/mihomo convert-ruleset domain mrs \
               work/fakeip-filter.mrs work/roundtrip.list >/dev/null 2>&1 \
             && [ -s work/roundtrip.list ]; then
            src_count=$(awk 'NF { n++ } END { print n+0 }' work/fakeip-filter.list)
            rt_count=$(awk 'NF { n++ } END { print n+0 }' work/roundtrip.list)
            echo "Round-trip: source=$src_count, from MRS=$rt_count"
            if [ "$rt_count" -lt "$((src_count * 95 / 100))" ]; then
              echo "::error::MRS содержит заметно меньше правил, чем .list ($rt_count < 95% от $src_count)"
              exit 1
            fi
            echo "Round-trip OK"
          else
            echo "::warning::Обратная конвертация MRS -> text недоступна в этой версии mihomo или вернула пустой результат; содержимое MRS не проверено."
          fi
          rm -f work/roundtrip.list

      - name: Check for suspicious rule count drop
        shell: bash
        env:
          # [#4] пусто при запуске по расписанию, true/false при ручном запуске
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          new_count=$(awk 'NF { n++ } END { print n+0 }' work/fakeip-filter.list)
          echo "New rules: $new_count"

          # Абсолютный минимум (force его НЕ обходит: защита от пустого/битого списка)
          if [ "$new_count" -lt 400 ]; then
            echo "::error::Rule count too low ($new_count < 400)"
            exit 1
          fi

          if [ -f rules/fakeip-filter.list ]; then
            old_count=$(awk 'NF { n++ } END { print n+0 }' rules/fakeip-filter.list)
            echo "Previous rules: $old_count"
            if [ "$old_count" -gt 0 ] && [ "$new_count" -lt "$((old_count * 70 / 100))" ]; then
              echo "=== Diff (removed / added) ==="
              sort rules/fakeip-filter.list > /tmp/old.sorted
              sort work/fakeip-filter.list  > /tmp/new.sorted
              echo "--- Removed ---"
              comm -23 /tmp/old.sorted /tmp/new.sorted | head -100
              echo "--- Added ---"
              comm -13 /tmp/old.sorted /tmp/new.sorted | head -100

              # [#4] обход порога
              if [ "${FORCE:-}" = "true" ]; then
                echo "::warning::Rule count dropped by more than 30% ($old_count -> $new_count), но force=true - продолжаем"
              else
                echo "::error::Rule count dropped by more than 30% ($old_count -> $new_count). Для обхода запусти вручную с force=true"
                exit 1
              fi
            fi
          fi

      # [ЖЕЛ] Коммитим только если изменился .list (или .mrs ещё не в репо).
      # Раньше новая версия mihomo могла иначе сериализовать .mrs при том же .list,
      # что давало лишний коммит и релиз. Побочный эффект: .mrs обновляется
      # вместе с .list, а не по обновлению mihomo - старые .mrs грузятся новыми
      # версиями mihomo без проблем.
      - name: Publish generated files
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rules
          cp work/fakeip-filter.list rules/fakeip-filter.list

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/fakeip-filter.list

          if git diff --cached --quiet && git ls-files --error-unmatch rules/fakeip-filter.mrs >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Rules unchanged; no release needed"
            exit 0
          fi

          cp work/fakeip-filter.mrs rules/fakeip-filter.mrs
          git add rules/fakeip-filter.mrs

          git commit -m "Update fakeip-filter rules (${{ steps.merge.outputs.final }} rules)" -m "Sources:
          - DustinWin: ${{ steps.merge.outputs.dustin_raw }} → ${{ steps.merge.outputs.dustin_new }} unique
          - wwqgtxx: ${{ steps.merge.outputs.wwqgtxx_raw }} → ${{ steps.merge.outputs.wwqgtxx_new }} unique
          Duplicates: ${{ steps.merge.outputs.duplicates }}
          Pruned (covered by +.): ${{ steps.merge.outputs.pruned }}"

          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Prepare release meta
        id: meta
        if: steps.publish.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "tag=fakeip-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "title=fakeip-filter $(date -u +'%Y-%m-%d %H:%M UTC') (${{ steps.merge.outputs.final }} rules)" >> "$GITHUB_OUTPUT"

      # Для сторонних экшенов можно закрепить коммит по SHA вместо тега
      # (softprops/action-gh-release@<sha> # v3) - защита от подмены тега.
      - name: Create release
        if: steps.publish.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: |
            Automated merge of fakeip-filter sources.

            | Source | Valid lines | Unique added |
            |--------|-------------|--------------|
            | DustinWin | ${{ steps.merge.outputs.dustin_raw }} | ${{ steps.merge.outputs.dustin_new }} |
            | wwqgtxx | ${{ steps.merge.outputs.wwqgtxx_raw }} | ${{ steps.merge.outputs.wwqgtxx_new }} |

            - Duplicates skipped: ${{ steps.merge.outputs.duplicates }}
            - Pruned (covered by `+.`): ${{ steps.merge.outputs.pruned }}
            - **Final rules: ${{ steps.merge.outputs.final }}**
          make_latest: true
          files: |
            work/fakeip-filter.mrs
            work/fakeip-filter.list

      # [ЖЕЛ] Чистим старые релизы fakeip-*, оставляем KEEP_RELEASES последних.
      # Удаляются только релизы с тегом fakeip-*, остальные не трогаем.
      # continue-on-error: сбой очистки не должен валить уже опубликованную сборку.
      - name: Cleanup old releases
        if: steps.publish.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,createdAt \
            --jq "map(select(.tagName | startswith(\"fakeip-\"))) | sort_by(.createdAt) | reverse | .[${KEEP_RELEASES}:] | .[].tagName" \
          | while read -r tag; do
              [ -n "$tag" ] || continue
              echo "Deleting old release: $tag"
              gh release delete "$tag" --cleanup-tag --yes
            done
