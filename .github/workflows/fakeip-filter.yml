
name: Build fakeip-filter

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: build-fakeip-filter
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CURL_OPTS: -fsSL --retry 3 --retry-delay 2 --retry-connrefused

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download source lists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work

          curl $CURL_OPTS \
            "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.list" \
            -o work/dustin.list

          curl $CURL_OPTS \
            "https://raw.githubusercontent.com/wwqgtxx/clash-rules/release/fakeip-filter.list" \
            -o work/wwqgtxx.list

          test -s work/dustin.list
          test -s work/wwqgtxx.list

          echo "DustinWin lines: $(wc -l < work/dustin.list)"
          echo "wwqgtxx lines: $(wc -l < work/wwqgtxx.list)"

      - name: Merge and deduplicate
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          sources = [
              Path("work/dustin.list"),
              Path("work/wwqgtxx.list"),
          ]

          seen = set()
          merged = []

          for source in sources:
              for line in source.read_text(encoding="utf-8-sig").splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or line in seen:
                      continue
                  seen.add(line)
                  merged.append(line)

          if not merged:
              raise SystemExit("Merged list is empty")

          # Сортировка (стабильные diff'ы)
          merged.sort(key=str.lower)

          Path("work/fakeip-filter.list").write_text(
              "\n".join(merged) + "\n",
              encoding="utf-8",
          )

          print(f"Unique rules: {len(merged)}")
          PY
      
      - name: Get latest Mihomo version
        id: mihomo
        run: |
          set -euo pipefail
          M_VER=$(curl $CURL_OPTS https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name | ltrimstr("v")')
          echo "version=$M_VER" >> "$GITHUB_OUTPUT"
          echo "Latest mihomo version: $M_VER"
      
      - name: Cache Mihomo binary
        id: cache-mihomo
        uses: actions/cache@v5
        with:
          path: work/mihomo
          key: mihomo-linux-amd64-${{ steps.mihomo.outputs.version }}
      
      - name: Install Mihomo
        run: |
          set -euo pipefail
          if [ ! -f work/mihomo ]; then
            M_VER=${{ steps.mihomo.outputs.version }}
            curl $CURL_OPTS -o mihomo.gz \
              "https://github.com/MetaCubeX/mihomo/releases/download/v${M_VER}/mihomo-linux-amd64-v${M_VER}.gz"
            gunzip -f mihomo.gz
            mv mihomo work/mihomo
          fi
          chmod +x work/mihomo
          sudo cp work/mihomo /usr/local/bin/mihomo
          mihomo -v
          

      - name: Build and validate MRS
        shell: bash
        run: |
          set -euo pipefail

          mihomo convert-ruleset domain text \
            work/fakeip-filter.list \
            work/fakeip-filter.mrs

          test -s work/fakeip-filter.mrs

          echo "Generated files:"
          ls -lh work/fakeip-filter.list work/fakeip-filter.mrs

      - name: Check for suspicious rule count drop
        shell: bash
        run: |
          set -euo pipefail

          new_count=$(awk 'NF { n++ } END { print n+0 }' work/fakeip-filter.list)
          echo "New rules: $new_count"

          if [ -f rules/fakeip-filter.list ]; then
            old_count=$(awk 'NF { n++ } END { print n+0 }' rules/fakeip-filter.list)
            echo "Previous rules: $old_count"

            if [ "$old_count" -gt 0 ] && [ "$new_count" -lt "$((old_count * 70 / 100))" ]; then
              echo "::error::Rule count dropped by more than 30%"
              echo "=== Diff (removed / added) ==="
              # показываем только различия
              sort rules/fakeip-filter.list > /tmp/old.sorted
              sort work/fakeip-filter.list  > /tmp/new.sorted
              echo "--- Removed ---"
              comm -23 /tmp/old.sorted /tmp/new.sorted | head -100
              echo "--- Added ---"
              comm -13 /tmp/old.sorted /tmp/new.sorted | head -100
              exit 1
            fi
          fi


      - name: Publish generated files
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p rules
          cp work/fakeip-filter.list rules/fakeip-filter.list
          cp work/fakeip-filter.mrs rules/fakeip-filter.mrs

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules/fakeip-filter.list rules/fakeip-filter.mrs

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Rules unchanged; no release needed"
            exit 0
          fi

          RULE_COUNT=$(wc -l < rules/fakeip-filter.list)
          git commit -m "Update fakeip-filter rules (${RULE_COUNT} rules)"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.publish.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: fakeip-${{ github.run_id }}
          name: fakeip-filter update ${{ github.run_number }}
          body: Automated update of merged fakeip-filter rules.
          make_latest: true
          files: |
            work/fakeip-filter.mrs
            work/fakeip-filter.list

